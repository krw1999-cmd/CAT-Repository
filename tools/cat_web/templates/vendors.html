{% extends "base.html" %}
{% block title %}Vendors{% endblock %}

{% block content %}
<div class="page-header">
  <h2>Vendors</h2>
</div>

<section class="section">
  <div class="section-header" style="margin-bottom:10px">
    <input type="search" id="vendor-search" class="input-sm" placeholder="Search vendors…"
           style="max-width:280px" oninput="filterVendors(this.value)">
    <span class="text-muted text-small" id="vendor-count"></span>
  </div>
  <div class="table-wrap">
    <table class="table table-compact">
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Notes</th>
          <th class="actions-col"></th>
        </tr>
      </thead>
      <tbody id="vendors-tbody">
        {% for v in vendors %}
          {% include "partials/_vendor_row.html" %}
        {% else %}
        <tr id="vendors-empty"><td colspan="5" class="text-center text-muted" style="padding:20px">No vendors yet.</td></tr>
        {% endfor %}
        <tr id="vendor-new-row-placeholder"></tr>
      </tbody>
    </table>
  </div>
  <div style="margin-top:8px">
    <button class="btn btn-ghost btn-sm"
            hx-get="{{ url_for('vendor_new_row') }}"
            hx-target="#vendor-new-row-placeholder"
            hx-swap="outerHTML">
      + Add Vendor
    </button>
  </div>
</section>

<script>
function filterVendors(q) {
  const term = q.trim().toLowerCase();
  const rows = document.querySelectorAll('#vendors-tbody tr[id^="vendor-"]');
  let visible = 0;
  rows.forEach(row => {
    if (row.id === 'vendor-new-row-placeholder') return;
    const text = row.textContent.toLowerCase();
    const show = !term || text.includes(term);
    row.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const count = document.getElementById('vendor-count');
  if (count) count.textContent = term ? visible + ' result' + (visible !== 1 ? 's' : '') : '';
}
</script>
{% endblock %}
