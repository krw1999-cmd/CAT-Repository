<div class="card claim-header">
  <form hx-post="{{ url_for('claim_header_save', claim_id=claim.id) }}"
        hx-target="#claim-header"
        hx-swap="innerHTML">
    <div class="header-grid">
      <div class="header-field">
        <label class="label" for="insured_name">Insured</label>
        <input id="insured_name" name="insured_name" type="text"
               value="{{ claim.insured_name or '' }}" class="input-sm" autofocus>
      </div>
      <div class="header-field">
        <label class="label" for="carrier">Carrier</label>
        <input id="carrier" name="carrier" type="text"
               value="{{ claim.carrier or '' }}" class="input-sm">
      </div>
      <div class="header-field">
        <label class="label" for="mortgage_company">Mortgage Co.</label>
        <input id="mortgage_company" name="mortgage_company" type="text"
               value="{{ claim.mortgage_company or '' }}" class="input-sm">
      </div>
      <div class="header-field">
        <label class="label" for="contract_pct">Contract %</label>
        <input id="contract_pct" name="contract_pct" type="number"
               step="0.01" min="0" max="100"
               value="{{ claim.contract_pct or 0 }}" class="input-sm input-narrow">
      </div>
      <div class="header-field">
        <label class="label" for="claim_number">Claim #</label>
        <input id="claim_number" name="claim_number" type="text"
               value="{{ claim.claim_number or '' }}" class="input-sm">
      </div>
      <div class="header-field">
        <label class="label" for="job_number">Job #</label>
        <input id="job_number" name="job_number" type="text"
               value="{{ claim.job_number or '' }}" class="input-sm">
      </div>
      <div class="header-field" style="min-width:130px">
        <label class="label" for="proc_method_carrier">Carrier Default</label>
        <select id="proc_method_carrier" name="proc_method_carrier" class="select-sm">
          <option value="">— not set —</option>
          <option value="iink"           {% if claim.proc_method_carrier == 'iink' %}selected{% endif %}>iink</option>
          <option value="sent_to_client" {% if claim.proc_method_carrier == 'sent_to_client' %}selected{% endif %}>Sent to Client</option>
          <option value="wire"           {% if claim.proc_method_carrier == 'wire' %}selected{% endif %}>Wire / ACH</option>
        </select>
      </div>
      <div class="header-field" style="min-width:130px">
        <label class="label" for="proc_method_draw">Draw Default</label>
        <select id="proc_method_draw" name="proc_method_draw" class="select-sm">
          <option value="">— not set —</option>
          <option value="iink"           {% if claim.proc_method_draw == 'iink' %}selected{% endif %}>iink</option>
          <option value="sent_to_client" {% if claim.proc_method_draw == 'sent_to_client' %}selected{% endif %}>Sent to Client</option>
          <option value="wire"           {% if claim.proc_method_draw == 'wire' %}selected{% endif %}>Wire / ACH</option>
        </select>
      </div>
      <div class="header-field" style="min-width:130px">
        <label class="label" for="proc_method_escrow">Escrow Default</label>
        <select id="proc_method_escrow" name="proc_method_escrow" class="select-sm">
          <option value="">— not set —</option>
          <option value="iink"           {% if claim.proc_method_escrow == 'iink' %}selected{% endif %}>iink</option>
          <option value="sent_to_client" {% if claim.proc_method_escrow == 'sent_to_client' %}selected{% endif %}>Sent to Client</option>
          <option value="wire"           {% if claim.proc_method_escrow == 'wire' %}selected{% endif %}>Wire / ACH</option>
        </select>
      </div>
    </div>
    <div style="margin-top:8px">
      <label class="label" for="claim_notes">Notes</label>
      <textarea id="claim_notes" name="notes" class="input-sm"
                style="width:100%; min-height:60px; resize:vertical; font-family:inherit; font-size:13px"
                placeholder="Optional notes…">{{ claim.notes or '' }}</textarea>
    </div>
    <div class="header-actions">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" class="btn btn-ghost btn-sm"
              hx-get="{{ url_for('claim_header_view', claim_id=claim.id) }}"
              hx-target="#claim-header"
              hx-swap="innerHTML">
        Cancel
      </button>
    </div>
  </form>
</div>
