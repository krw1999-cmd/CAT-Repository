<tr id="exp-split-{{ split.id }}">
  <td class="capitalize">{{ split.role }}</td>
  <td>{{ split.name }}</td>
  <td class="num">{{ "%.2f"|format(split.split_pct or 0) }}%</td>
  <td class="num">
    {% set wp_amt = expense.wp_amount or 0 %}
    {% set pct = (split.split_pct or 0) / 100 %}
    {{ (wp_amt * pct) | money }}
  </td>
  <td class="actions-col">
    <button class="btn-icon"
            hx-get="{{ url_for('exp_split_edit_row', claim_id=claim.id, exp_id=expense.id, sid=split.id) }}"
            hx-target="#exp-split-{{ split.id }}"
            hx-swap="outerHTML"
            title="Edit">✎</button>
    <button class="btn-icon btn-icon-danger"
            hx-delete="{{ url_for('exp_split_delete', claim_id=claim.id, exp_id=expense.id, sid=split.id) }}"
            hx-target="#exp-split-{{ split.id }}"
            hx-swap="outerHTML"
            hx-confirm="Remove this split?"
            title="Delete">✕</button>
  </td>
</tr>
