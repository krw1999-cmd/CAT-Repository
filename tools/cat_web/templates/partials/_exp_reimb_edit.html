{% set row_id = "exp-reimb-new-row-placeholder" %}
{% set save_url = url_for('exp_reimb_create', claim_id=claim.id, exp_id=expense.id) %}
{% set form_id = "exp-reimb-form-new" %}

<tr id="{{ row_id }}">
  <td>
    <input type="date" min="2000-01-01" max="2099-12-31" name="date" class="input-sm" form="{{ form_id }}"
           value="{{ r.date if r else '' }}">
  </td>
  <td>
    <input type="number" name="amount" step="0.01" class="input-sm input-num" form="{{ form_id }}"
           value="{{ r.amount if r else '' }}" style="width:100px">
  </td>
  <td>
    <select name="method" class="input-sm select-sm" form="{{ form_id }}">
      <option value="">—</option>
      <option value="check" {% if r and r.method == 'check' %}selected{% endif %}>Check</option>
      <option value="ach"   {% if r and r.method == 'ach'   %}selected{% endif %}>ACH</option>
      <option value="cc"    {% if r and r.method == 'cc'    %}selected{% endif %}>CC</option>
      <option value="other" {% if r and r.method == 'other' %}selected{% endif %}>Other</option>
    </select>
  </td>
  <td>
    <input type="text" name="reference" class="input-sm" form="{{ form_id }}"
           value="{{ r.reference if r else '' }}" placeholder="Ref #" style="width:80px">
  </td>
  <td>
    <select name="linked_tx_id" class="input-sm select-sm" form="{{ form_id }}">
      <option value="">— none —</option>
      {% for t in claim_txs_for_select %}
      <option value="{{ t.id }}"
              {% if r and r.linked_tx_id == t.id %}selected{% endif %}>
        #{{ t.sequence_number }} {{ t.type }} {{ t.date or '' }}
      </option>
      {% endfor %}
    </select>
  </td>
  <td>
    <input type="text" name="notes" class="input-sm" form="{{ form_id }}"
           value="{{ r.notes if r else '' }}" placeholder="Notes" style="width:120px">
  </td>
  <td class="actions-col">
    <button class="btn btn-primary btn-sm" form="{{ form_id }}" type="submit">Save</button>
    <button type="button" class="btn btn-ghost btn-sm"
            onclick="document.getElementById('exp-reimb-new-row-placeholder').outerHTML='<tr id=&quot;exp-reimb-new-row-placeholder&quot;></tr>'">
      ✕
    </button>
  </td>
</tr>

<script>
(function() {
  const f = document.createElement('form');
  f.id = '{{ form_id }}';
  f.setAttribute('hx-post', '{{ save_url }}');
  f.setAttribute('hx-target', '#{{ row_id }}');
  f.setAttribute('hx-swap', 'outerHTML');
  f.style.display = 'none';
  document.body.appendChild(f);
  htmx.process(f);
})();
</script>
