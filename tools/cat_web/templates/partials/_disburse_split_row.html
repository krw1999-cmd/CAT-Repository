<tr id="dsplit-{{ split.id }}">
  <td class="capitalize">{{ split.role }}</td>
  <td>{{ split.name }}</td>
  <td class="num">{{ "%.2f"|format(split.split_pct or 0) }}%</td>
  <td class="num">{{ ((split.split_pct or 0) / 100 * (d.fee_owed or 0)) | money }}</td>
  <td class="actions-col">
    <button class="btn-icon"
            hx-get="{{ url_for('disburse_split_edit_row', claim_id=claim.id, tx_id=tx.id, did=d.id, sid=split.id) }}"
            hx-target="#dsplit-{{ split.id }}"
            hx-swap="outerHTML"
            title="Edit">✎</button>
    <button class="btn-icon btn-icon-danger"
            hx-delete="{{ url_for('disburse_split_delete', claim_id=claim.id, tx_id=tx.id, did=d.id, sid=split.id) }}"
            hx-target="#dsplit-{{ split.id }}"
            hx-swap="outerHTML"
            hx-confirm="Remove this split?"
            title="Delete">✕</button>
  </td>
</tr>
