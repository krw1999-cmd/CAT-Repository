{% extends "base.html" %}
{% block title %}New Claim{% endblock %}

{% block content %}
<div class="page-header">
  <h2>New Claim</h2>
  <a href="{{ url_for('claims_list') }}" class="btn btn-ghost">Cancel</a>
</div>

<div class="card" style="max-width:540px">
  <form method="POST" action="{{ url_for('new_claim') }}">
    <div class="form-grid-2">
      <div class="field">
        <label>Job Number</label>
        <input name="job_number" type="text" placeholder="WP-2024-001" autofocus>
      </div>
      <div class="field">
        <label>Claim Number</label>
        <input name="claim_number" type="text" placeholder="Carrier claim #">
      </div>
    </div>
    <div class="field">
      <label>Insured Name</label>
      <input name="insured_name" type="text" placeholder="John Smith" required>
    </div>
    <div class="field">
      <label>Carrier</label>
      <input name="carrier" type="text" placeholder="State Farm">
    </div>
    <div class="field" style="max-width:180px">
      <label>Contract %</label>
      <input name="contract_pct" type="number" step="0.01" min="0" max="100"
             placeholder="10" value="10">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Claim</button>
      <a href="{{ url_for('claims_list') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
